[project]
name = "gaussian-splats"
version = "0.1.0"
description = "A from-scratch Gaussian splatting research implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "torch>=2.4",
]

[project.scripts]
visualize = "gaussian_splats.visualize.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
