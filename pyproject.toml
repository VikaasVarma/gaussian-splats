[project]
name = "gaussian-splats"
version = "0.1.0"
description = "A from-scratch Gaussian splatting research implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "plyfile>=1.1",
    "pillow>=10.4",
    "seaborn>=0.13",
    "starlette>=0.47",
    "torch>=2.4",
    "tqdm>=4.66",
    "triton>=3.4 ; sys_platform == 'linux'",
    "triton @ git+https://github.com/triton-lang/triton.git@570e5b4dd1e2d1daf785a894d19268fe7b281cb5 ; sys_platform == 'darwin'",
    "nvidia-cutlass-dsl>=4.4 ; sys_platform == 'linux'",
    "typer>=0.16",
    "uvicorn>=0.35",
]

[project.scripts]
visualize = "gaussian_splats.visualize.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_splats"]
artifacts = ["src/gaussian_splats/kernels/rasterize/cuda_sort.cu"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = [
    "src/gaussian_splats/kernels/rasterize/tests",
    "src/gaussian_splats/kernels/rasterize/cute/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
