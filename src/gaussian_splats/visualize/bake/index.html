<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench / Gaussian splats</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body data-endpoint="/bake">
    <div class="bake-labels"><span id="left-label">Workbench (Torch)</span><span>Gaussian splats</span></div>
    <details id="settings" class="panel">
      <summary>Bake</summary>
      <form>
        <label>Scene <input id="scene" type="file" accept=".gltf,.glb" /></label>
        <label>Renderer <select name="renderer"></select></label>
        <div id="renderer-settings"></div>
        <label>Splats <input name="num_splats" type="number" required min="1" value="10000" /></label>
        <label>Sampling resolution (overrides count) <input name="sampling_resolution" type="number" min="2" placeholder="Use splat count" /></label>
        <label>SH smoothing (%) <input name="sh_smoothing_percent" type="number" required min="0" max="100" step="any" value="0" /></label>
        <label>Seed <input name="seed" type="number" required value="0" /></label>
        <label>Sampling / fitting device <input name="device" required value="cpu" /></label>
        <button id="bake" type="button" disabled>Bake Workbench → Splats</button>
        <button id="pause" type="button">Pause scene</button>
        <output id="count"></output>
        <div id="status">Choose a glTF or GLB scene</div>
      </form>
    </details>
    <script type="module" src="page.js"></script>
  </body>
</html>
