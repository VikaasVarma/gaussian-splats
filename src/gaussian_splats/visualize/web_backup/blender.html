<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blender viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/blender.css" />
  </head>
  <body>
    <details id="hud" class="panel" open>
      <summary>Stats</summary>
      <div id="stats">FPS: --</div>
      <div id="fps-chart"></div>
      <footer>Click to look · WASD to move · Space/Shift up/down · H toggles HUD</footer>
    </details>
    <details id="settings" class="panel" open>
      <summary>Scene</summary>
      <form>
        <div class="checkpoint-setting">
          <input id="scene" type="file" accept=".gltf,.glb" />
          <label for="scene" class="file-button">Choose glTF</label>
          <span id="scene-name">No file selected</span>
        </div>
        <label>Renderer <select id="renderer" name="renderer"></select></label>
        <div id="status" class="scene-status">No scene loaded</div>
      </form>
    </details>
    <canvas id="viewer" width="640" height="480">Blender output</canvas>
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
    <script type="module" src="/blender.js"></script>
  </body>
</html>
