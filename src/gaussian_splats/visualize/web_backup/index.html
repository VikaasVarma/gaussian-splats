<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rasterizer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <details id="hud" class="panel" open>
      <summary>Stats</summary>
      <div id="stats">RTT: --</div>
      <div id="fps-chart"></div>
      <div id="timing-total">Total: --</div>
      <div id="timing-chart"></div>
      <footer>Click to look · WASD to move · Space/Shift up/down · H toggles HUD</footer>
    </details>

    <details id="settings" class="panel">
      <summary>Settings</summary>
      <form>
        <div class="checkpoint-setting">
          <input id="checkpoint" type="file" accept=".ply" />
          <label for="checkpoint" class="file-button">Choose checkpoint</label>
          <span id="checkpoint-name">No file selected</span>
        </div>
        <label>Camera <select name="camera"><option value="pinhole">Pinhole</option></select></label>
        <label>Tile size <input name="tile_size" type="number" min="1" value="8" /></label>
        <label>Opacity threshold <input name="opacity_threshold" type="number" min="0" max="1" step="0.001" value="0.999" /></label>
        <label>Near plane <input name="near" type="number" min="0" step="0.1" value="0.1" /></label>
        <label>Far plane <input name="far" type="number" min="0" step="1" value="100" /></label>
        <label>Splats <span class="splat-count"><input name="num_splats" type="number" min="1" value="10000" /><output id="splat-total">/ --</output></span></label>
        <label>Rendering <select name="rendering_mode"><option value="gaussian">Gaussian</option><option value="ellipsoid">Ellipsoid</option></select></label>
        <label id="confidence-setting" class="subsetting" hidden>↳ Confidence <input name="confidence" type="number" min="0.001" max="0.999" step="0.01" value="0.95" /></label>
      </form>
    </details>

    <canvas id="viewer" width="640" height="480">Rasterizer output</canvas>
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
